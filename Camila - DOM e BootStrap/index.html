    <main>

        <div id="bannerCarrossel" class="carousel slide" data-bs-autoplay="true"> <!-- Rolagem dos slides automatico -->
            <div class="carousel-inner">
                <div class="carousel-item active"> <!-- O active que dize que vai ser este que está na tela -->
                    <img src="../Camila - DOM e BootStrap/Img e Svg/Lebensfreude Banner.jpg" alt="" class="d-block w-100 rounded-5">
                </div>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item">
                    <img src="../Camila - DOM e BootStrap/Img e Svg/banner2.jpg" alt="" class="d-block w-100 rounded-5">
                </div>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item">
                    <img src="../Camila - DOM e BootStrap/Img e Svg/Banner3.jpg" alt="" class="d-block w-100 rounded-5">
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#bannerCarrosel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#bannerCarrosel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#bannerCarrosel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
                <div>
                    <button class="btn-icon btn-sm carousel-control-play-pause" type="button" data-bs-target="#bannerCarrosel" aria-label="Pause" data-bs-pause-label="Pause" data-bs-play-label="Play">
                        <span class="carousel-icon-pause" aria-hidden="true"></span>
                        <span class="carousel-icon-play" aria-hidden="true"></span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#bannerCarrosel" data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#bannerCarrosel" data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>

            </div>
        </div>

    </main>
